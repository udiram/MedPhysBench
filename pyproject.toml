[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "medphysbench"
version = "0.2.0"
description = "Reproducible, safety-aware benchmark for medical-physics AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "MedPhysBench contributors" }]
dependencies = ["PyYAML>=6.0", "jsonschema>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]
platform = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "boto3>=1.36",
]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]

[project.scripts]
medphys-bench = "medphys_agentbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/medphys_agentbench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
