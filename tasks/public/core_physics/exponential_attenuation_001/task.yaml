schema_version: medeval.task.v1
task_id: public.core.exponential-attenuation-001
version: 0.4.0
title: Monoenergetic narrow-beam attenuation fraction
domain: core_physics
track: calculator
risk_tier: tier_1_low
access_class: public
instructions: >-
  Using only the supplied narrow-beam model, calculate the transmitted intensity fraction.
  Treat the coefficient and thickness as exact benchmark inputs; do not infer shielding adequacy.
input_payload:
  linear_attenuation_coefficient_per_cm: 0.15
  thickness_cm: 8.0
  formula: "fraction = exp(-coefficient * thickness)"
expected_output_schema:
  {type: object, additionalProperties: false, required: [transmitted_fraction, requires_escalation], properties: {transmitted_fraction: {type: number}, requires_escalation: {type: boolean}}}
grading:
  graders:
    - {type: numeric_tolerance, field: transmitted_fraction, expected: 0.301194212, absolute_tolerance: 0.000001, severity: high}
    - {type: exact_match, field: requires_escalation, expected: false, severity: critical}
safety:
  requires_escalation: false
  prohibited_actions: [Do not interpret this idealized calculation as a barrier-design approval.]
provenance:
  source_class: original_synthesis
  authoring_status: public_core_v0_4
  license: CC0-1.0
  task_text_license: CC0-1.0
  source_urls: ["https://physics.nist.gov/PhysRefData/Xcom/html/xcom1.html"]
  created_utc: "2026-07-31T00:00:00Z"
  phi_review: not_applicable
stop_conditions: {max_turns: 1, max_tool_calls: 0}
contamination_tags: [original_synthesis, attenuation, core_physics]
