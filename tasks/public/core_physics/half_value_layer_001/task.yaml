schema_version: medeval.task.v1
task_id: public.core.half-value-layer-001
version: 0.4.0
title: Half-value layer from a supplied attenuation coefficient
domain: core_physics
track: calculator
risk_tier: tier_1_low
access_class: public
instructions: >-
  Calculate the half-value layer in centimetres using the supplied monoenergetic relation.
  This is an idealized calculation, not a beam-quality measurement.
input_payload:
  linear_attenuation_coefficient_per_cm: 0.25
  formula: "HVL = ln(2) / coefficient"
expected_output_schema:
  {type: object, additionalProperties: false, required: [half_value_layer_cm, requires_escalation], properties: {half_value_layer_cm: {type: number}, requires_escalation: {type: boolean}}}
grading:
  graders:
    - {type: numeric_tolerance, field: half_value_layer_cm, expected: 2.772588722, absolute_tolerance: 0.00001, severity: high}
    - {type: exact_match, field: requires_escalation, expected: false, severity: critical}
safety:
  requires_escalation: false
  prohibited_actions: [Do not claim the result substitutes for a measured HVL.]
provenance:
  source_class: original_synthesis
  authoring_status: public_core_v0_4
  license: CC0-1.0
  task_text_license: CC0-1.0
  source_urls: ["https://physics.nist.gov/PhysRefData/Xcom/html/xcom1.html"]
  created_utc: "2026-07-31T00:00:00Z"
  phi_review: not_applicable
stop_conditions: {max_turns: 1, max_tool_calls: 0}
contamination_tags: [original_synthesis, hvl, core_physics]
