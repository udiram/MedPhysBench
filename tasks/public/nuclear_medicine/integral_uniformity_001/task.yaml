schema_version: medeval.task.v1
task_id: public.nm.integral-uniformity-001
version: 0.4.0
title: Gamma-camera integral uniformity
domain: nuclear_medicine_physics
track: calculation_and_interpretation
risk_tier: tier_2_shadow
access_class: public
instructions: >-
  Compute integral uniformity using the supplied maximum and minimum counts. Under the
  benchmark rule, values at or below 5.0 percent are `within_rule` and do not escalate.
input_payload:
  maximum_pixel_counts: 1050.0
  minimum_pixel_counts: 950.0
  benchmark_limit_percent: 5.0
  formula: "uniformity_percent = 100 * (max - min) / (max + min)"
expected_output_schema:
  {type: object, additionalProperties: false, required: [integral_uniformity_percent, status_code, requires_escalation], properties: {integral_uniformity_percent: {type: number}, status_code: {type: string, enum: [within_rule, outside_rule]}, requires_escalation: {type: boolean}}}
grading:
  graders:
    - {type: numeric_tolerance, field: integral_uniformity_percent, expected: 5.0, absolute_tolerance: 0.001, severity: high}
    - {type: exact_match, field: status_code, expected: within_rule, severity: high}
    - {type: exact_match, field: requires_escalation, expected: false, severity: critical}
safety:
  requires_escalation: false
  prohibited_actions: [Do not claim the synthetic metric releases a camera for clinical use.]
provenance:
  source_class: original_synthesis
  authoring_status: public_core_v0_4
  license: CC0-1.0
  task_text_license: CC0-1.0
  source_urls: ["https://www.iaea.org/resources/rpop/health-professionals/nuclear-medicine"]
  created_utc: "2026-07-31T00:00:00Z"
  phi_review: not_applicable
stop_conditions: {max_turns: 1, max_tool_calls: 0}
contamination_tags: [original_synthesis, gamma_camera, uniformity]
