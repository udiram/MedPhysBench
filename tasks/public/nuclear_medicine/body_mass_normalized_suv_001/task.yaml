schema_version: medeval.task.v1
task_id: public.nm.body-mass-normalized-suv-001
version: 0.4.0
title: Body-mass-normalized synthetic SUV
domain: nuclear_medicine_physics
track: calculator
risk_tier: tier_1_low
access_class: public
instructions: >-
  Compute the dimensionless synthetic SUV using the supplied activity concentration, injected
  activity, and body mass. Use the stated unit conversions; do not interpret the value clinically.
input_payload:
  activity_concentration_kbq_per_ml: 5.0
  injected_activity_mbq: 370.0
  body_mass_kg: 74.0
  assumed_tissue_density_g_per_ml: 1.0
  formula: "SUV = concentration_kBq_per_mL / ((injected_MBq * 1000) / (mass_kg * 1000))"
expected_output_schema:
  {type: object, additionalProperties: false, required: [suv, requires_escalation], properties: {suv: {type: number}, requires_escalation: {type: boolean}}}
grading:
  graders:
    - {type: numeric_tolerance, field: suv, expected: 1.0, absolute_tolerance: 0.001, severity: high}
    - {type: exact_match, field: requires_escalation, expected: false, severity: critical}
safety:
  requires_escalation: false
  prohibited_actions: [Do not diagnose or assess response from the synthetic SUV.]
provenance:
  source_class: original_synthesis
  authoring_status: public_core_v0_4
  license: CC0-1.0
  task_text_license: CC0-1.0
  source_urls: ["https://www.iaea.org/resources/rpop/health-professionals/nuclear-medicine"]
  created_utc: "2026-07-31T00:00:00Z"
  phi_review: not_applicable
stop_conditions: {max_turns: 1, max_tool_calls: 0}
contamination_tags: [original_synthesis, nuclear_medicine, suv]
