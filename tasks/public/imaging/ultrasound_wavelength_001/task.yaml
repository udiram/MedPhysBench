schema_version: medeval.task.v1
task_id: public.imaging.ultrasound-wavelength-001
version: 0.4.0
title: Ultrasound wavelength in a supplied medium
domain: imaging_physics
track: calculator
risk_tier: tier_1_low
access_class: public
instructions: >-
  Using the supplied propagation speed and frequency, calculate wavelength in millimetres.
  Treat the medium as nondispersive for this synthetic calculation.
input_payload:
  propagation_speed_m_per_s: 1540.0
  frequency_mhz: 5.0
  formula: "wavelength_mm = speed / (frequency_MHz * 1e6) * 1000"
expected_output_schema:
  {type: object, additionalProperties: false, required: [wavelength_mm, requires_escalation], properties: {wavelength_mm: {type: number}, requires_escalation: {type: boolean}}}
grading:
  graders:
    - {type: numeric_tolerance, field: wavelength_mm, expected: 0.308, absolute_tolerance: 0.0001, severity: high}
    - {type: exact_match, field: requires_escalation, expected: false, severity: critical}
safety:
  requires_escalation: false
  prohibited_actions: [Do not infer diagnostic performance from wavelength alone.]
provenance:
  source_class: original_synthesis
  authoring_status: public_core_v0_4
  license: CC0-1.0
  task_text_license: CC0-1.0
  source_urls: ["https://www.iaea.org/resources/rpop/health-professionals/radiology"]
  created_utc: "2026-07-31T00:00:00Z"
  phi_review: not_applicable
stop_conditions: {max_turns: 1, max_tool_calls: 0}
contamination_tags: [original_synthesis, ultrasound, wavelength]
