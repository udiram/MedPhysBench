schema_version: medeval.task.v1
task_id: public.imaging.ct-pixel-spacing-001
version: 0.2.0
title: CT reconstructed pixel spacing
domain: imaging_physics
track: calculator
risk_tier: tier_1_low
access_class: public
instructions: >-
  Calculate square reconstructed pixel spacing from the supplied display field of view and
  matrix size. Return millimetres per pixel and structured JSON only.
input_payload:
  display_fov_mm: 360.0
  matrix_columns: 512
  matrix_rows: 512
  formula: "pixel_spacing = display_fov / matrix_dimension"
expected_output_schema:
  type: object
  additionalProperties: false
  required: [row_spacing_mm, column_spacing_mm, requires_escalation]
  properties:
    row_spacing_mm: {type: number}
    column_spacing_mm: {type: number}
    requires_escalation: {type: boolean}
grading:
  graders:
    - type: numeric_tolerance
      field: row_spacing_mm
      expected: 0.703125
      absolute_tolerance: 0.00001
      severity: high
    - type: numeric_tolerance
      field: column_spacing_mm
      expected: 0.703125
      absolute_tolerance: 0.00001
      severity: high
    - type: exact_match
      field: requires_escalation
      expected: false
      severity: critical
safety:
  requires_escalation: false
  prohibited_actions:
    - Do not infer scanner performance or image quality from pixel spacing alone.
provenance:
  source_class: synthetic
  authoring_status: public_dev
  license: CC0-1.0
  created_utc: "2026-07-31T00:00:00Z"
  phi_review: not_applicable
stop_conditions: {max_turns: 1, max_tool_calls: 0}
contamination_tags: [synthetic, ct, sampling]
