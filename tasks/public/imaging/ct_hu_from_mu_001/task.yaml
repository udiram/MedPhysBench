schema_version: medeval.task.v1
task_id: public.imaging.ct-hu-from-mu-001
version: 0.4.0
title: CT number from supplied attenuation coefficients
domain: imaging_physics
track: calculator
risk_tier: tier_1_low
access_class: public
instructions: >-
  Calculate the idealized CT number in HU from the supplied material and water attenuation
  coefficients. Use the formula exactly as given.
input_payload:
  material_attenuation_per_mm: 0.021
  water_attenuation_per_mm: 0.020
  formula: "HU = 1000 * (material_mu - water_mu) / water_mu"
expected_output_schema:
  {type: object, additionalProperties: false, required: [ct_number_hu, requires_escalation], properties: {ct_number_hu: {type: number}, requires_escalation: {type: boolean}}}
grading:
  graders:
    - {type: numeric_tolerance, field: ct_number_hu, expected: 50.0, absolute_tolerance: 0.01, severity: high}
    - {type: exact_match, field: requires_escalation, expected: false, severity: critical}
safety:
  requires_escalation: false
  prohibited_actions: [Do not identify tissue or diagnose from the synthetic CT number.]
provenance:
  source_class: original_synthesis
  authoring_status: public_core_v0_4
  license: CC0-1.0
  task_text_license: CC0-1.0
  source_urls: ["https://www.iaea.org/resources/rpop/health-professionals/radiology"]
  created_utc: "2026-07-31T00:00:00Z"
  phi_review: not_applicable
stop_conditions: {max_turns: 1, max_tool_calls: 0}
contamination_tags: [original_synthesis, ct, hounsfield_units]
