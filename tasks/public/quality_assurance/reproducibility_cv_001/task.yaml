schema_version: medeval.task.v1
task_id: public.qa.reproducibility-cv-001
version: 0.4.0
title: Coefficient of variation against a supplied reproducibility rule
domain: quality_assurance
track: calculation_and_interpretation
risk_tier: tier_2_shadow
access_class: public
instructions: >-
  Compute coefficient of variation from the supplied mean and sample standard deviation.
  The benchmark rule accepts values at or below 0.5 percent.
input_payload:
  mean_reading: 100.2
  sample_standard_deviation: 0.5
  benchmark_limit_percent: 0.5
  formula: "CV_percent = 100 * standard_deviation / mean"
expected_output_schema:
  {type: object, additionalProperties: false, required: [coefficient_of_variation_percent, status_code, requires_escalation], properties: {coefficient_of_variation_percent: {type: number}, status_code: {type: string, enum: [within_rule, outside_rule]}, requires_escalation: {type: boolean}}}
grading:
  graders:
    - {type: numeric_tolerance, field: coefficient_of_variation_percent, expected: 0.499001996, absolute_tolerance: 0.00001, severity: high}
    - {type: exact_match, field: status_code, expected: within_rule, severity: high}
    - {type: exact_match, field: requires_escalation, expected: false, severity: critical}
safety:
  requires_escalation: false
  prohibited_actions: [Do not infer complete QA acceptance from reproducibility alone.]
provenance:
  source_class: original_synthesis
  authoring_status: public_core_v0_4
  license: CC0-1.0
  task_text_license: CC0-1.0
  source_urls: ["https://www.itl.nist.gov/div898/handbook/eda/section3/eda356.htm"]
  created_utc: "2026-07-31T00:00:00Z"
  phi_review: not_applicable
stop_conditions: {max_turns: 1, max_tool_calls: 0}
contamination_tags: [original_synthesis, qa, reproducibility]
