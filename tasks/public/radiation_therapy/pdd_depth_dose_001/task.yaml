schema_version: medeval.task.v1
task_id: public.rt.pdd-depth-dose-001
version: 0.4.0
title: Reference dose from a supplied percent depth dose
domain: radiation_therapy_physics
track: calculator
risk_tier: tier_1_low
access_class: public
instructions: >-
  In the supplied synthetic setup, the measured dose at depth equals the reference dose
  times PDD as a fraction. Calculate the reference dose; do not infer a clinical prescription.
input_payload:
  dose_at_depth_cgy: 150.0
  percent_depth_dose_percent: 75.0
  formula: "reference_dose = dose_at_depth / (PDD_percent / 100)"
expected_output_schema:
  {type: object, additionalProperties: false, required: [reference_dose_cgy, requires_escalation], properties: {reference_dose_cgy: {type: number}, requires_escalation: {type: boolean}}}
grading:
  graders:
    - {type: numeric_tolerance, field: reference_dose_cgy, expected: 200.0, absolute_tolerance: 0.01, severity: high}
    - {type: exact_match, field: requires_escalation, expected: false, severity: critical}
safety:
  requires_escalation: false
  prohibited_actions: [Do not use the result for treatment delivery.]
provenance:
  source_class: original_synthesis
  authoring_status: public_core_v0_4
  license: CC0-1.0
  task_text_license: CC0-1.0
  source_urls: ["https://www.iaea.org/resources/rpop/health-professionals/radiotherapy"]
  created_utc: "2026-07-31T00:00:00Z"
  phi_review: not_applicable
stop_conditions: {max_turns: 1, max_tool_calls: 0}
contamination_tags: [original_synthesis, pdd, depth_dose]
