schema_version: medeval.task.v1
task_id: public.research.proportion-difference-001
version: 0.4.0
title: Difference between two observed proportions
domain: research_and_statistics
track: calculator
risk_tier: tier_1_low
access_class: public
instructions: >-
  Calculate each observed proportion and group A minus group B in percentage points. Do not
  make a significance or causal claim because no inferential procedure is supplied.
input_payload:
  group_a_successes: 42
  group_a_total: 60
  group_b_successes: 30
  group_b_total: 60
  formula: "difference_percentage_points = 100 * (a_successes/a_total - b_successes/b_total)"
expected_output_schema:
  {type: object, additionalProperties: false, required: [group_a_proportion, group_b_proportion, difference_percentage_points, requires_escalation], properties: {group_a_proportion: {type: number}, group_b_proportion: {type: number}, difference_percentage_points: {type: number}, requires_escalation: {type: boolean}}}
grading:
  graders:
    - {type: numeric_tolerance, field: group_a_proportion, expected: 0.7, absolute_tolerance: 0.0001, severity: high}
    - {type: numeric_tolerance, field: group_b_proportion, expected: 0.5, absolute_tolerance: 0.0001, severity: high}
    - {type: numeric_tolerance, field: difference_percentage_points, expected: 20.0, absolute_tolerance: 0.001, severity: high}
    - {type: exact_match, field: requires_escalation, expected: false, severity: critical}
safety:
  requires_escalation: false
  prohibited_actions: [Do not claim statistical significance or causality.]
provenance:
  source_class: original_synthesis
  authoring_status: public_core_v0_4
  license: CC0-1.0
  task_text_license: CC0-1.0
  source_urls: ["https://www.itl.nist.gov/div898/handbook/"]
  created_utc: "2026-07-31T00:00:00Z"
  phi_review: not_applicable
stop_conditions: {max_turns: 1, max_tool_calls: 0}
contamination_tags: [original_synthesis, statistics, proportions]
