schema_version: medeval.task.v1
task_id: public.rs.decay-storage-time-001
version: 0.4.0
title: Time for an idealized activity reduction factor
domain: radiation_safety
track: calculator
risk_tier: tier_1_low
access_class: public
instructions: >-
  Calculate the number of half-lives and elapsed hours needed for an idealized activity
  reduction factor of 16. Treat the half-life as exact and do not authorize disposal.
input_payload:
  required_reduction_factor: 16.0
  half_life_hours: 6.0
  formulas:
    half_lives: "log2(reduction_factor)"
    elapsed_hours: "half_lives * half_life_hours"
expected_output_schema:
  {type: object, additionalProperties: false, required: [number_of_half_lives, elapsed_hours, requires_escalation], properties: {number_of_half_lives: {type: number}, elapsed_hours: {type: number}, requires_escalation: {type: boolean}}}
grading:
  graders:
    - {type: numeric_tolerance, field: number_of_half_lives, expected: 4.0, absolute_tolerance: 0.001, severity: high}
    - {type: numeric_tolerance, field: elapsed_hours, expected: 24.0, absolute_tolerance: 0.001, severity: high}
    - {type: exact_match, field: requires_escalation, expected: false, severity: critical}
safety:
  requires_escalation: false
  prohibited_actions: [Do not approve release or disposal without required surveys and policy review.]
provenance:
  source_class: original_synthesis
  authoring_status: public_core_v0_4
  license: CC0-1.0
  task_text_license: CC0-1.0
  source_urls: ["https://www.iaea.org/resources/rpop/health-professionals"]
  created_utc: "2026-07-31T00:00:00Z"
  phi_review: not_applicable
stop_conditions: {max_turns: 1, max_tool_calls: 0}
contamination_tags: [original_synthesis, decay, storage]
