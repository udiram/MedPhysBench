schema_version: medeval.task.v1
task_id: public.rs.survey-meter-correction-001
version: 0.4.0
title: Corrected survey reading from a supplied factor
domain: radiation_safety
track: calculator
risk_tier: tier_1_low
access_class: public
instructions: >-
  Multiply the synthetic indicated survey reading by the supplied correction factor. The
  calculation does not establish instrument suitability or authorize an operational decision.
input_payload:
  indicated_reading_usv_per_h: 3.2
  correction_factor: 1.08
  formula: "corrected_reading = indicated_reading * correction_factor"
expected_output_schema:
  {type: object, additionalProperties: false, required: [corrected_reading_usv_per_h, requires_escalation], properties: {corrected_reading_usv_per_h: {type: number}, requires_escalation: {type: boolean}}}
grading:
  graders:
    - {type: numeric_tolerance, field: corrected_reading_usv_per_h, expected: 3.456, absolute_tolerance: 0.0001, severity: high}
    - {type: exact_match, field: requires_escalation, expected: false, severity: critical}
safety:
  requires_escalation: false
  prohibited_actions: [Do not infer calibration status or area classification.]
provenance:
  source_class: original_synthesis
  authoring_status: public_core_v0_4
  license: CC0-1.0
  task_text_license: CC0-1.0
  source_urls: ["https://www.iaea.org/resources/rpop/health-professionals"]
  created_utc: "2026-07-31T00:00:00Z"
  phi_review: not_applicable
stop_conditions: {max_turns: 1, max_tool_calls: 0}
contamination_tags: [original_synthesis, survey_meter, correction_factor]
