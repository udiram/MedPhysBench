schema_version: medeval.task.v1
task_id: public.brachy.source-decay-inventory-001
version: 0.4.0
title: Decayed source strength from a supplied half-life
domain: brachytherapy_physics
track: calculator
risk_tier: tier_1_low
access_class: public
instructions: >-
  Calculate the remaining synthetic source strength after the stated elapsed time. Use only
  the supplied half-life formula and report units of U.
input_payload:
  initial_source_strength_u: 12.0
  elapsed_days: 45.0
  half_life_days: 60.0
  formula: "remaining_strength = initial_strength * 0.5 ** (elapsed_days / half_life_days)"
expected_output_schema:
  {type: object, additionalProperties: false, required: [remaining_source_strength_u, requires_escalation], properties: {remaining_source_strength_u: {type: number}, requires_escalation: {type: boolean}}}
grading:
  graders:
    - {type: numeric_tolerance, field: remaining_source_strength_u, expected: 7.13524269, absolute_tolerance: 0.0001, severity: high}
    - {type: exact_match, field: requires_escalation, expected: false, severity: critical}
safety:
  requires_escalation: false
  prohibited_actions: [Do not claim inventory arithmetic verifies a physical source.]
provenance:
  source_class: original_synthesis
  authoring_status: public_core_v0_4
  license: CC0-1.0
  task_text_license: CC0-1.0
  source_urls: ["https://www.iaea.org/resources/rpop/health-professionals/radiotherapy"]
  created_utc: "2026-07-31T00:00:00Z"
  phi_review: not_applicable
stop_conditions: {max_turns: 1, max_tool_calls: 0}
contamination_tags: [original_synthesis, brachytherapy, decay]
