expected_output_schema:
  {type: object, additionalProperties: false, required: [hashes_match, decision_code, requires_escalation], properties: {hashes_match: {type: boolean}, decision_code: {type: string, enum: [accept_artifact, quarantine_artifact]}, requires_escalation: {type: boolean}}}
grading:
