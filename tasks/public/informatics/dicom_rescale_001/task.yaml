schema_version: medeval.task.v1
task_id: public.info.dicom-rescale-001
version: 0.4.0
title: DICOM stored-value rescaling
domain: informatics
track: calculator
risk_tier: tier_1_low
access_class: public
instructions: >-
  Apply the supplied linear rescale slope and intercept to the synthetic stored pixel value.
  Return the rescaled value only; do not interpret anatomy or diagnosis.
input_payload:
  stored_pixel_value: 1100
  rescale_slope: 1.0
  rescale_intercept: -1024.0
  formula: "rescaled_value = stored_value * slope + intercept"
expected_output_schema:
  {type: object, additionalProperties: false, required: [rescaled_value, requires_escalation], properties: {rescaled_value: {type: number}, requires_escalation: {type: boolean}}}
grading:
  graders:
    - {type: numeric_tolerance, field: rescaled_value, expected: 76.0, absolute_tolerance: 0.001, severity: high}
    - {type: exact_match, field: requires_escalation, expected: false, severity: critical}
safety:
  requires_escalation: false
  prohibited_actions: [Do not infer a clinical finding from one synthetic pixel value.]
provenance:
  source_class: original_synthesis
  authoring_status: public_core_v0_4
  license: CC0-1.0
  task_text_license: CC0-1.0
  source_urls: ["https://www.dicomstandard.org/current"]
  created_utc: "2026-07-31T00:00:00Z"
  phi_review: not_applicable
stop_conditions: {max_turns: 1, max_tool_calls: 0}
contamination_tags: [original_synthesis, dicom, rescale]
