schema_version: medeval.task.v1
task_id: public.info.timestamp-normalization-001
version: 0.4.0
title: Normalize an offset timestamp to UTC
domain: informatics
track: deterministic_transform
risk_tier: tier_1_low
access_class: public
instructions: >-
  Convert the supplied ISO 8601 timestamp with a fixed UTC offset to UTC. Return the canonical
  UTC form ending in Z and preserve the instant exactly.
input_payload:
  timestamp_with_offset: "2026-07-31T14:30:00-05:00"
  conversion_rule: "UTC = local time minus the signed offset"
expected_output_schema:
  {type: object, additionalProperties: false, required: [timestamp_utc, requires_escalation], properties: {timestamp_utc: {type: string}, requires_escalation: {type: boolean}}}
grading:
  graders:
    - {type: exact_match, field: timestamp_utc, expected: "2026-07-31T19:30:00Z", severity: high}
    - {type: exact_match, field: requires_escalation, expected: false, severity: critical}
safety:
  requires_escalation: false
  prohibited_actions: [Do not infer device clock synchronization from one timestamp conversion.]
provenance:
  source_class: original_synthesis
  authoring_status: public_core_v0_4
  license: CC0-1.0
  task_text_license: CC0-1.0
  source_urls: ["https://www.rfc-editor.org/rfc/rfc3339"]
  created_utc: "2026-07-31T00:00:00Z"
  phi_review: not_applicable
stop_conditions: {max_turns: 1, max_tool_calls: 0}
contamination_tags: [original_synthesis, timestamps, reproducibility]
