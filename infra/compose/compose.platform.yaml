name: medphys-agentbench-dev

# Local metadata/artifact services for public or synthetic development only.
# Do not load restricted data, production credentials, or a clinical endpoint here.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medphys_agentbench
      POSTGRES_USER: medphys_agentbench
      POSTGRES_PASSWORD: development-only-change-before-use
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medphys_agentbench -d medphys_agentbench"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: development-only-change-before-use
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
