name: Model evaluation request
description: Request a reviewed MedPhysBench evaluation for a specific model configuration
title: "[Model request] "
labels: ["model-request", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Requests are public. Do not include API keys, credentials, PHI, private labels, clinical screenshots, or confidential provider information. A named model is not added to Results until a complete released run passes the publication contract.
  - type: input
    id: model
    attributes:
      label: Exact model or deployment identifier
      description: Use the provider-facing identifier, not only a marketing family name.
      placeholder: provider/model-version
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider or serving route
      placeholder: OpenAI API, Groq, Ollama, self-hosted, etc.
    validations:
      required: true
  - type: textarea
    id: revision
    attributes:
      label: Revision and artifact identity
      description: Include retrieval date, revision, immutable digest, quantization, and vision projector when applicable.
    validations:
      required: true
  - type: dropdown
    id: modalities
    attributes:
      label: Required modalities
      multiple: true
      options:
        - Text
        - Image
    validations:
      required: true
  - type: textarea
    id: route
    attributes:
      label: Reproducible access route
      description: Describe the endpoint class, region, account constraints, or local runtime. Never paste a credential.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this model should be prioritized
      description: Note expected use, scientific comparison value, or an available no-cost evaluation route.
    validations:
      required: true
  - type: checkboxes
    id: declarations
    attributes:
      label: Publication and safety declarations
      options:
        - label: I did not include credentials, PHI, private labels, or confidential material.
          required: true
        - label: I understand that failures, telemetry gaps, exact configuration, and limitations may be published.
          required: true
        - label: I understand that MedPhysBench is research-only and does not validate clinical use.
          required: true
