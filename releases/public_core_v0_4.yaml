schema_version: medeval.release.v1
release_id: public-core-v0.4
title: MedPhysBench Public Core v0.4
description: >-
  Research-only public suite of 64 original and synthetic medical-physics tasks spanning
  core physics, imaging, radiation therapy, brachytherapy, nuclear medicine, radiation
  safety, quality assurance, informatics, and research statistics. Tasks are calculation,
  bounded interpretation, or safe-escalation exercises and do not authorize clinical action.
allow_access_classes: [public]
