schema_version: medeval.release.v1
release_id: public-tg263-pilot-v0.5
title: MedPhysBench Public TG-263 Pilot v0.5
description: >-
  Research-only public pilot of 18 independently authored, synthetic structure-naming
  tasks aligned with TG-263 concepts. The lane stresses conservative normalization,
  ambiguity handling, collision detection, and safe escalation; it does not redistribute
  the AAPM worksheet and does not authorize RTSTRUCT mutation or clinical use.
allow_access_classes: [public]
public_attempt_detail: sanitized_output
expected_attempts_per_task: 1
